[package]
edition = "2021"
name = "lora-stm32wl-examples"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[features]
lptim = ["embassy-stm32/time-driver-lptim1"]
any = ["embassy-stm32/time-driver-any"]


[dependencies]
# Change stm32wle5jc to your chip name, if necessary. Also update .cargo/config.toml
embassy-stm32 = { version = "0.6.0", features = [
    "defmt",
    "stm32wle5jc",
    "memory-x",
    "unstable-pac",
    "exti",
    "chrono",
    "executor-thread",
    "low-power",
    "low-power-debug-with-sleep",
    "low-power-defmt-flush",

] }
embassy-executor = { version = "0.10.0", features = [
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_000",
] }
embassy-sync = { version = "0.8", features = ["defmt"] }
embassy-futures = { version = "0", features = [] }

lora-phy = { path = "../../lora-phy", features = ["lorawan-radio", "defmt-03"] }
lorawan-device = { path = "../../lorawan-device", features = [
    "embassy-time",
    "defmt-03",
] }

defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

cortex-m = { version = "0.7.6", features = [
    "inline-asm",
    "critical-section-single-core",
] }
cortex-m-rt = "0.7.0"
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }
embedded-hal-bus = { version = "0.2.0", features = ["async"] }

[profile.release]
debug = 2
